<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluentgrid PMO — Import Project Security Data</title>
<style>
:root {
  --background: 0 0% 100%; --foreground: 240 10% 3.9%;
  --card: 0 0% 100%; --card-foreground: 240 10% 3.9%;
  --primary: 168 76% 36%; --primary-foreground: 0 0% 100%;
  --secondary: 240 4.8% 95.9%; --secondary-foreground: 240 5.9% 10%;
  --muted: 240 4.8% 95.9%; --muted-foreground: 240 3.8% 46.1%;
  --border: 240 5.9% 90%; --input: 240 5.9% 90%; --ring: 168 76% 36%;
  --radius: 0.75rem; --radius-sm: 0.5rem;
  --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
}
.dark {
  --background: 240 10% 3.9%; --foreground: 0 0% 98%;
  --card: 240 10% 5.5%; --card-foreground: 0 0% 98%;
  --primary: 168 64% 45%; --primary-foreground: 0 0% 100%;
  --secondary: 240 3.7% 15.9%; --secondary-foreground: 0 0% 98%;
  --muted: 240 3.7% 15.9%; --muted-foreground: 240 5% 64.9%;
  --border: 240 3.7% 15.9%; --input: 240 3.7% 15.9%; --ring: 168 64% 45%;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:hsl(var(--background));color:hsl(var(--foreground));font-size:.875rem;line-height:1.5}
.container{max-width:900px;margin:0 auto;padding:2rem 1.5rem}
.brand{display:flex;align-items:center;gap:.75rem;font-weight:800;font-size:1.25rem;margin-bottom:2rem}
.brand img{height:2.5rem}
.card{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:var(--radius);box-shadow:var(--shadow);padding:1.5rem;margin-bottom:1.5rem}
.card h1{font-size:1.5rem;font-weight:700;margin-bottom:.5rem}
.card p{color:hsl(var(--muted-foreground));margin-bottom:1rem}
label{display:block;font-size:.875rem;font-weight:500;margin-bottom:.5rem}
textarea{width:100%;min-height:220px;padding:.75rem;border-radius:var(--radius-sm);border:1px solid hsl(var(--input));background:hsl(var(--background));color:hsl(var(--foreground));font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem;line-height:1.5;resize:vertical}
textarea:focus{outline:none;border-color:hsl(var(--ring));box-shadow:0 0 0 2px hsl(var(--ring)/.2)}
.actions{display:flex;gap:.75rem;justify-content:flex-end;margin-top:1rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;height:2.5rem;padding:0 1rem;border-radius:var(--radius-sm);font-size:.875rem;font-weight:500;border:1px solid transparent;cursor:pointer;transition:.15s}
.btn-primary{background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
.btn-outline{background:transparent;border-color:hsl(var(--border));color:hsl(var(--foreground))}
.result{margin-top:1rem;padding:1rem;border-radius:var(--radius-sm);background:hsl(var(--muted));display:none}
.result.show{display:block}
.result.success{background:hsl(142 76% 36%/.12);color:hsl(142 76% 30%)}
.result.error{background:hsl(0 84% 60%/.12);color:hsl(0 84% 50%)}
pre{font-family:ui-monospace,monospace;font-size:.8rem;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="container">
  <div class="brand"><img src="/logo" alt="Fluentgrid" style="height:2.5rem"><span>fluentgrid PMO</span></div>

  <div class="card">
    <h1>Import Project Security Data</h1>
    <p>Paste your project security tracker CSV below. The first row must be the header. Existing projects are updated by name; deliverables are matched by project + security requirement category.</p>

    <label>Required columns</label>
    <textarea id="csvInput" placeholder="Project Name, BU / Vertical, Project Type, Infra Managed By, Project Manager / SPOC, Security Requirement, Iteration/ Frequency, Last Audit Date, Next Audit Due, Project Start Date, Project End Date, Status, Remarks&#10;SBPDCL AMI, AMI, Maintenance, Client, Aditya Vijay, External VAPT (CERT-In empaneled), Annual, 2025-08-12, 2026-08-12, 2023-01-01, 2026-12-31, Valid, Remediation closed&#10;..."></textarea>

    <div class="actions">
      <button class="btn btn-outline" onclick="loadSample()">Load sample</button>
      <button class="btn btn-primary" onclick="importCSV()">Import CSV</button>
    </div>

    <div id="result" class="result"><pre id="resultText"></pre></div>
  </div>

  <div class="card">
    <p style="margin-bottom:0"><a href="/dashboard" style="color:hsl(var(--primary));font-weight:600">← Back to dashboard</a></p>
  </div>
</div>

<script>
const token = localStorage.getItem('auth_token');
if(!token) window.location.href = '/login';

function api(method, path, body){
  const headers = {'Content-Type':'application/json'};
  if(token) headers['X-Auth-Token'] = token;
  return fetch(path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token), {
    method: method, headers: headers, body: body ? JSON.stringify(body) : undefined
  }).then(r => r.json().catch(() => ({})));
}

function loadSample(){
  document.getElementById('csvInput').value = `Project Name,BU / Vertical,Project Type,Infra Managed By,Project Manager / SPOC,Security Requirement,Iteration/ Frequency,Last Audit Date,Next Audit Due,Project Start Date,Project End Date,Status,Remarks
SBPDCL AMI,AMI,Maintenance,Client,Aditya Vijay,External VAPT (CERT-In empaneled),Annual,2025-08-12,2026-08-12,2023-01-01,2026-12-31,Valid,Remediation closed
SBPDCL AMI,AMI,Maintenance,Client,Aditya Vijay,Internal VAPT (Client quarterly),Quarterly,2026-03-15,2026-06-15,2023-01-01,2026-12-31,Valid,N/A
SBPDCL AMI,AMI,Maintenance,Client,Aditya Vijay,Patch Management,Monthly,2026-05-01,2026-06-01,2023-01-01,2026-12-31,Valid,Automated patching
APEPDCL URMS,CIS,Implementation,Fluentgrid,Murali Baggam,DISCOM Cybersecurity Audit,Annual,2025-11-20,2026-11-20,2022-06-01,2026-06-30,Valid,Cleared
APEPDCL URMS,CIS,Implementation,Fluentgrid,Murali Baggam,DPDP Compliance Review,Annual,2025-04-10,2026-04-10,2022-06-01,2026-06-30,Due soon,Consent review pending`;
}

function importCSV(){
  const csv = document.getElementById('csvInput').value.trim();
  const res = document.getElementById('result');
  const txt = document.getElementById('resultText');
  if(!csv){ txt.textContent = 'Please paste CSV data first'; res.className='result error show'; return; }
  api('POST','/api/import/projects-csv',{csv:csv}).then(d => {
    if(d.success){
      const s = d.summary;
      txt.textContent = `Import successful!\nProjects created: ${s.projects_created}\nProjects updated: ${s.projects_updated}\nDeliverables created: ${s.deliverables_created}\nDeliverables updated: ${s.deliverables_updated}\nErrors: ${s.errors.length ? s.errors.join('\n') : 'none'}`;
      res.className = 'result success show';
    } else {
      txt.textContent = 'Error: ' + (d.message || 'Unknown error');
      res.className = 'result error show';
    }
  }).catch(e => {
    txt.textContent = 'Error: ' + e.message;
    res.className = 'result error show';
  });
}
</script>
</body>
</html>
